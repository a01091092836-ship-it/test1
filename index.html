<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="[이름]의 개인 웹사이트" />
    <title>[이름] | 개인 웹사이트</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top">[이름]</a>
      <nav aria-label="주요 메뉴">
        <a href="#about">소개</a>
        <a href="#projects">프로젝트</a>
        <a href="#contact">연락처</a>
      </nav>
    </header>

    <main id="top">
      <!-- 히어로: 하늘색 배경 + Zdog 캐릭터 -->
      <section class="hero">
        <div class="hero-text">
          <p class="eyebrow">안녕하세요 👋</p>
          <h1>저는 <span class="accent">[이름]</span>입니다</h1>
          <p class="lead">[여기에 한 줄 소개를 적어 주세요]</p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#projects">프로젝트 보기</a>
            <a class="btn btn-ghost" href="#contact">연락하기</a>
          </div>
        </div>
        <canvas class="illo" role="img" aria-label="춤추는 캐릭터 애니메이션"></canvas>
      </section>

      <section id="about" class="section">
        <h2>소개</h2>
        <p>
          [자기소개를 2~3문장으로 적어 주세요. 어떤 일을 좋아하는지, 지금 무엇을
          배우고 있는지 등을 쓰면 좋아요.]
        </p>
      </section>

      <section id="projects" class="section">
        <h2>프로젝트</h2>
        <div class="cards">
          <article class="card">
            <h3>[프로젝트 이름 1]</h3>
            <p>[프로젝트에 대한 짧은 설명]</p>
          </article>
          <article class="card">
            <h3>[프로젝트 이름 2]</h3>
            <p>[프로젝트에 대한 짧은 설명]</p>
          </article>
          <article class="card">
            <h3>[프로젝트 이름 3]</h3>
            <p>[프로젝트에 대한 짧은 설명]</p>
          </article>
        </div>
      </section>

      <section id="contact" class="section">
        <h2>연락처</h2>
        <ul class="links">
          <li>
            <a href="https://github.com/a01091092836-ship-it" target="_blank" rel="noopener">GitHub</a>
          </li>
          <li>이메일: [이메일 주소]</li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p>© 2026 [이름]</p>
    </footer>

    <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js" defer></script>
    <script src="./script.js" defer></script>
  </body>
</html>
